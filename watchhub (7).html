<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WatchHub</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f4f5f8;background:#0f1014;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:13px 5%;background:#17181d;border-bottom:1px solid #ffffff12}.logo{font-size:21px;font-weight:900;color:#ff4e5b;white-space:nowrap}.search{display:flex;flex:1;max-width:620px;margin:auto}.search input{width:100%;border:1px solid #ffffff20;border-radius:9px 0 0 9px;padding:11px 14px;outline:0;color:#fff;background:#26272e}.search button,.add-btn{border:0;border-radius:0 9px 9px 0;padding:0 18px;color:#fff;background:#ff3445;font-weight:bold;cursor:pointer}.user{border:0;border-radius:8px;padding:10px 13px;color:#fff;background:#292a32;cursor:pointer}.language{border:1px solid #ffffff20;border-radius:8px;padding:10px;color:#fff;background:#292a32;cursor:pointer}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:210px;padding:22px 13px;border-right:1px solid #ffffff12;background:#15161b}aside button{display:block;width:100%;margin:4px 0;border:0;border-radius:8px;padding:12px;text-align:left;color:#cbd0e0;background:transparent;cursor:pointer}aside button:hover,aside button.active{color:#fff;background:#2a2c35}.main{width:min(1180px,92%);margin:auto;padding:30px 0}.hero{margin-bottom:26px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,45px)}.hero p{margin:0;color:#a7adbf}.section-title{display:flex;align-items:center;justify-content:space-between;margin:25px 0 15px}.section-title h2{margin:0;font-size:20px}.add-btn{border-radius:8px;padding:10px 14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}.video-card{overflow:hidden;border:1px solid #ffffff12;border-radius:12px;background:#1a1b21;cursor:pointer;transition:.2s}.video-card:hover{transform:translateY(-3px);border-color:#ff3445}.thumb{position:relative;aspect-ratio:16/9;background:#2a2b33 center/cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#ff3445dd}.video-info{padding:12px}.video-info h3{overflow:hidden;margin:0 0 7px;white-space:nowrap;text-overflow:ellipsis;font-size:15px}.video-info p{margin:0;color:#989fb4;font-size:12px}.video-actions{margin-top:10px}.watch-button{border:0;border-radius:7px;padding:7px 9px;color:#dce1f0;background:#292b35;font-size:12px;cursor:pointer}.watch-button.saved{color:#17131f;background:#ffcf55}.delete-button{margin-left:6px;border:0;border-radius:7px;padding:7px 9px;color:#ffb1b8;background:#3a2029;font-size:12px;cursor:pointer}.empty{padding:35px;border:1px dashed #ffffff25;border-radius:12px;color:#a7adbf;text-align:center}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#000b}.modal-box{width:min(92%,900px);padding:18px;border-radius:14px;background:#1b1d24}.player{overflow:hidden;aspect-ratio:16/9;border-radius:8px;background:#000}.player iframe{width:100%;height:100%;border:0}.close{float:right;border:0;color:#fff;background:none;font-size:23px;cursor:pointer}.add-form{display:grid;gap:11px}.add-form input,.add-form textarea{border:1px solid #ffffff20;border-radius:8px;padding:12px;color:#fff;background:#292b33;font:inherit}.add-form textarea{min-height:110px;resize:vertical}.add-form button{border:0;border-radius:8px;padding:12px;color:#fff;background:#ff3445;font-weight:bold;cursor:pointer}.hidden{display:none}@media(max-width:700px){aside{display:none}.top{gap:8px}.logo{font-size:17px}.user{display:none}.main{width:92%}}
</style>
</head>
<body>
<header class="top"><div class="logo">▶ WatchHub</div><form id="searchForm" class="search"><input id="searchInput" placeholder="Cari di library kamu..."><button>Cari</button></form><select id="languageSelect" class="language" title="Language"><option value="id">🇮🇩 ID</option><option value="en">🇬🇧 EN</option><option value="ru">🇷🇺 RU</option><option value="uz">🇺🇿 UZ</option></select><button class="user">Guest</button></header>
<div class="layout"><aside><button class="active" data-filter="all" id="homeNav">⌂ Home</button><button data-filter="saved" id="savedNav">♡ Watch Later</button><button data-filter="recent" id="historyNav">◷ History</button><button id="youtubeSearch">↗ Cari di YouTube</button></aside><main class="main"><section class="hero"><h1 id="heroTitle">Nonton apa hari ini?</h1><p id="heroText">Tambahkan video YouTube favoritmu dan tonton dari satu library yang rapi.</p></section><div class="section-title"><h2 id="sectionTitle">Video kamu</h2><button id="openAdd" class="add-btn">＋ Tambah Video</button></div><div id="cards" class="cards"></div></main></div>
<div id="playerModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="playerModal">×</button><div id="player" class="player"></div><h2 id="playerTitle"></h2><p id="playerChannel" style="color:#a7adbf"></p></div></div>
<div id="addModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="addModal">×</button><h2 id="addTitle">Tambah video YouTube</h2><form id="addForm" class="add-form"><input id="videoTitle" required placeholder="Judul video"><textarea id="videoUrl" required placeholder="Paste link YouTube atau kode HTML iframe di sini"></textarea><input id="videoChannel" placeholder="Nama channel"><label style="color:#cbd0e0;font-size:13px"><input id="isShort" type="checkbox"> Ini YouTube Short</label><button id="saveVideoButton">Simpan ke WatchHub</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jdphpvyyoedffevvmxgv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_PUBLISHABLE_KEY_HERE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const KEY='watchhub-library-local-v1';const VISITOR_KEY='watchhub-visitor-id';const visitorId=localStorage.getItem(VISITOR_KEY)||crypto.randomUUID();localStorage.setItem(VISITOR_KEY,visitorId);let videos=[],filter='all';const $=id=>document.getElementById(id);
const translations={id:{hero:'Nonton apa hari ini?',heroText:'Tambahkan video YouTube favoritmu dan tonton dari satu library yang rapi.',home:'⌂ Beranda',saved:'♡ Tonton Nanti',history:'◷ Riwayat',searchYoutube:'↗ Cari di YouTube',yourVideos:'Video kamu',add:'＋ Tambah Video',empty:'Belum ada video. Klik “＋ Tambah Video” untuk memasukkan link YouTube.',addTitle:'Tambah video YouTube',titlePlaceholder:'Judul video',urlPlaceholder:'Paste link YouTube atau kode HTML iframe di sini',channelPlaceholder:'Nama channel',save:'Simpan ke WatchHub'},en:{hero:'What do you want to watch?',heroText:'Add your favorite YouTube videos and watch them from one organized library.',home:'⌂ Home',saved:'♡ Watch Later',history:'◷ History',searchYoutube:'↗ Search YouTube',yourVideos:'Your videos',add:'＋ Add Video',empty:'No videos yet. Click “＋ Add Video” to add a YouTube link.',addTitle:'Add YouTube video',titlePlaceholder:'Video title',urlPlaceholder:'Paste a YouTube link or HTML iframe code here',channelPlaceholder:'Channel name',save:'Save to WatchHub'},ru:{hero:'Что будем смотреть?',heroText:'Добавляйте любимые видео YouTube в одну удобную библиотеку.',home:'⌂ Главная',saved:'♡ Смотреть позже',history:'◷ История',searchYoutube:'↗ Искать на YouTube',yourVideos:'Ваши видео',add:'＋ Добавить видео',empty:'Видео пока нет. Нажмите «＋ Добавить видео», чтобы добавить ссылку YouTube.',addTitle:'Добавить видео YouTube',titlePlaceholder:'Название видео',urlPlaceholder:'Вставьте ссылку YouTube или HTML-код iframe',channelPlaceholder:'Название канала',save:'Сохранить в WatchHub'},uz:{hero:'Bugun nima tomosha qilamiz?',heroText:'Sevimli YouTube videolaringizni bitta tartibli kutubxonaga qo‘shing.',home:'⌂ Bosh sahifa',saved:'♡ Keyin ko‘rish',history:'◷ Tarix',searchYoutube:'↗ YouTube’da qidirish',yourVideos:'Videolaringiz',add:'＋ Video qo‘shish',empty:'Hozircha video yo‘q. YouTube havolasini qo‘shish uchun «＋ Video qo‘shish»ni bosing.',addTitle:'YouTube videosini qo‘shish',titlePlaceholder:'Video nomi',urlPlaceholder:'YouTube havolasi yoki HTML iframe kodini joylang',channelPlaceholder:'Kanal nomi',save:'WatchHub’ga saqlash'}};
let language=localStorage.getItem('watchhub-language')||'id';
function applyLanguage(){const t=translations[language]||translations.id;document.documentElement.lang=language;$('languageSelect').value=language;$('heroTitle').textContent=t.hero;$('heroText').textContent=t.heroText;$('homeNav').textContent=t.home;$('savedNav').textContent=t.saved;$('historyNav').textContent=t.history;$('youtubeSearch').textContent=t.searchYoutube;$('sectionTitle').textContent=t.yourVideos;$('openAdd').textContent=t.add;$('addTitle').textContent=t.addTitle;$('videoTitle').placeholder=t.titlePlaceholder;$('videoUrl').placeholder=t.urlPlaceholder;$('videoChannel').placeholder=t.channelPlaceholder;$('saveVideoButton').textContent=t.save;}
$('languageSelect').onchange=e=>{language=e.target.value;localStorage.setItem('watchhub-language',language);applyLanguage()};
function idFromUrl(value){const iframe=value.match(/(?:src=["']|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/i);if(iframe)return iframe[1];try{const u=new URL(value.trim());if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('?')[0];return u.searchParams.get('v')||u.pathname.split('/').pop()}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(videos))}
async function loadVideos(){const {data,error}=await db.from('watchhub_videos').select('*').order('created_at',{ascending:false});if(!error&&data){const ids=data.map(v=>v.id);const saved=ids.length?(await db.from('watchhub_saved').select('video_id').eq('visitor_id',visitorId).in('video_id',ids)).data||[]:[];const history=ids.length?(await db.from('watchhub_history').select('video_id,watched_at').eq('visitor_id',visitorId).in('video_id',ids)).data||[]:[];videos=data.map(v=>({id:v.youtube_id,title:v.title,channel:v.channel||'YouTube',last:(history.find(h=>h.video_id===v.id)||{}).watched_at,saved:saved.some(s=>s.video_id===v.id),dbId:v.id,visitor_id:v.visitor_id,isShort:!!v.is_short}));render()}else{videos=JSON.parse(localStorage.getItem(KEY)||'[]');render()}}
function thumb(id){return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg'}
function render(list=videos){const cards=$('cards');cards.innerHTML='';if(!list.length){cards.innerHTML='<div class="empty">'+(translations[language]||translations.id).empty+'</div>';return}list.forEach((v,i)=>{const card=document.createElement('article');card.className='video-card';card.innerHTML='<div class="thumb"></div><div class="video-info"><h3></h3><p></p><div class="video-actions"><button class="watch-button">♡ Watch Later</button>'+(v.isShort?'<span style="margin-left:6px;color:#ff6470;font-size:11px">SHORT</span>':'')+(v.visitor_id===visitorId?'<button class="delete-button">Hapus</button>':'')+'</div></div>';card.querySelector('.thumb').style.backgroundImage='url('+thumb(v.id)+')';card.querySelector('.thumb').innerHTML='<span class="play">▶</span>';card.querySelector('h3').textContent=v.title;card.querySelector('p').textContent=v.channel||'YouTube';const watchButton=card.querySelector('.watch-button');watchButton.textContent=v.saved?'♥ Tersimpan':'♡ Watch Later';watchButton.classList.toggle('saved',!!v.saved);watchButton.onclick=event=>{event.stopPropagation();toggleSaved(v)};const deleteButton=card.querySelector('.delete-button');if(deleteButton)deleteButton.onclick=event=>{event.stopPropagation();deleteVideo(v)};card.onclick=()=>play(v);cards.appendChild(card)})}
async function deleteVideo(v){if(!v.dbId||v.visitor_id!==visitorId)return;if(!confirm('Hapus video ini dari WatchHub?'))return;const {error}=await db.from('watchhub_videos').delete().eq('id',v.dbId).eq('visitor_id',visitorId);if(error){alert('Video gagal dihapus: '+error.message);return}await loadVideos();applyFilter()}
async function toggleSaved(v){if(!v.dbId)return;let result;if(v.saved){result=await db.from('watchhub_saved').delete().eq('visitor_id',visitorId).eq('video_id',v.dbId)}else{result=await db.from('watchhub_saved').insert({visitor_id:visitorId,video_id:v.dbId})}if(result.error){alert('Watch Later gagal diperbarui: '+result.error.message);return}v.saved=!v.saved;applyFilter()}
async function play(v){if(v.dbId){await db.from('watchhub_history').upsert({visitor_id:visitorId,video_id:v.dbId,watched_at:new Date().toISOString()},{onConflict:'visitor_id,video_id'});v.last=Date.now()}$('player').innerHTML='<iframe src="https://www.youtube.com/embed/'+v.id+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';$('playerTitle').textContent=v.title;$('playerChannel').textContent=v.channel||'YouTube';$('playerModal').classList.remove('hidden');v.last=Date.now();save()}
function applyFilter(){let q=$('searchInput').value.toLowerCase();let list=videos.filter(v=>(v.title+' '+(v.channel||'')).toLowerCase().includes(q));if(filter==='saved')list=list.filter(v=>v.saved);if(filter==='recent')list=list.filter(v=>v.last).sort((a,b)=>(new Date(b.last||0))-(new Date(a.last||0)));render(list)}
$('openAdd').onclick=()=>$('addModal').classList.remove('hidden');$('addForm').onsubmit=async e=>{e.preventDefault();const id=idFromUrl($('videoUrl').value.trim());if(!id)return alert('Link YouTube atau kode HTML iframe tidak terbaca.');const title=$('videoTitle').value.trim(),channel=$('videoChannel').value.trim(),isShort=$('isShort').checked;const {error}=await db.from('watchhub_videos').insert({title,youtube_id:id,channel:channel||'YouTube',visitor_id:visitorId,is_short:isShort});if(error){alert('Video gagal disimpan: '+error.message);return}e.target.reset();$('addModal').classList.add('hidden');await loadVideos();applyFilter()};$('searchForm').onsubmit=e=>{e.preventDefault();applyFilter()};$('youtubeSearch').onclick=()=>{const q=prompt('Cari video di YouTube:');if(q)open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')};document.querySelectorAll('aside button[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;applyFilter()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).classList.add('hidden');if(b.dataset.close==='playerModal')$('player').innerHTML=''});document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add('hidden')});applyLanguage();loadVideos();
</script>
</body>
</html>
