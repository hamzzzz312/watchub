<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WatchHub Feed</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif;scroll-behavior:smooth}.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:linear-gradient(#08090dcc,transparent)}.logo{font-weight:900;font-size:20px;color:#ff5361}.back{border:0;border-radius:8px;padding:9px 13px;color:#fff;background:#ffffff1a;cursor:pointer}.feed{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}.item{position:relative;display:grid;place-items:center;height:100vh;scroll-snap-align:start}.video{width:min(100vw,900px);height:min(78vh,510px);border:0;border-radius:14px;background:#151821;box-shadow:0 10px 50px #000}.info{position:absolute;bottom:7%;left:50%;width:min(90%,900px);transform:translateX(-50%);padding:16px;border-radius:12px;background:linear-gradient(transparent,#000d);pointer-events:none}.info h2{margin:25px 0 5px;font-size:20px}.info p{margin:0;color:#c1c8da}.empty{display:grid;place-items:center;height:100vh;color:#aeb6ca;text-align:center}.loading{padding:100px;text-align:center;color:#b4bdd5}.unmute{position:absolute;right:5%;bottom:12%;border:0;border-radius:50%;width:45px;height:45px;color:#fff;background:#ff3445;cursor:pointer}.side{position:absolute;right:5%;bottom:24%;display:grid;gap:8px}.side button{border:0;border-radius:10px;padding:11px;color:#fff;background:#ffffff1c;cursor:pointer}.side button:hover{background:#ff3445}</style></head><body><header class="top"><div class="logo">▶ WatchHub</div><button class="back" onclick="location.href='index.html'">Home</button></header><main id="feed" class="feed"><div class="loading">Memuat video...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://jdphpvyyoedffevvmxgv.supabase.co';const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_PUBLISHABLE_KEY_HERE';const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const feed=document.getElementById('feed');
function videoId(v){return v.youtube_id}function render(videos){if(!videos.length){feed.innerHTML='<div class="empty">Belum ada video di WatchHub.</div>';return}feed.innerHTML=videos.map((v,i)=>'<section class="item"><iframe class="video" data-id="'+videoId(v)+'" src="https://www.youtube.com/embed/'+videoId(v)+'?enablejsapi=1&autoplay=0&mute=1&controls=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><div class="info"><h2>'+escapeHtml(v.title)+'</h2><p>'+escapeHtml(v.channel||'YouTube')+'</p></div><div class="side"><button onclick="likeHint()">♡ Like</button><button onclick="saveHint()">＋ Save</button></div><button class="unmute" onclick="toggleSound(this)">🔇</button></section>').join('');observe()}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function observe(){const io=new IntersectionObserver(entries=>entries.forEach(e=>{const f=e.target;if(e.isIntersecting&&e.intersectionRatio>.65){f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":[]}','*')}else{f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":[]}','*')}}),{threshold:[.65]});document.querySelectorAll('.video').forEach(v=>io.observe(v))}function toggleSound(btn){const frame=btn.parentElement.querySelector('.video');frame.src=frame.src.replace('mute=1','mute=0')+'&autoplay=1';btn.textContent='🔊'}function likeHint(){alert('Login untuk Like video.')}function saveHint(){alert('Login untuk menyimpan video.')}db.from('watchhub_videos').select('youtube_id,title,channel,created_at').order('created_at',{ascending:false}).then(({data,error})=>{if(error){feed.innerHTML='<div class="empty">Gagal memuat video: '+escapeHtml(error.message)+'</div>';return}render(data||[])})
</script></body></html>
