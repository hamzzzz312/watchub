:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#ff3445dd}.video-info{padding:12px}.video-info h3{overflow:hidden;margin:0 0 7px;white-space:nowrap;text-overflow:ellipsis;font-size:15px}.video-info p{margin:0;color:#989fb4;font-size:12px}.channel-link{border:0;padding:0;color:#989fb4;background:none;font-size:12px;cursor:pointer}.channel-link:hover{color:#ff6470}.view-count{display:block;margin-top:5px;color:#7f89a4;font-weight:normal}.video-actions{margin-top:10px}.watch-button{border:0;border-radius:7px;padding:7px 9px;color:#dce1f0;background:#292b35;font-size:12px;cursor:pointer}.watch-button.saved{color:#17131f;background:#ffcf55}.edit-button,.delete-button,.playlist-button{margin-left:6px;border:0;border-radius:7px;padding:7px 9px;font-size:12px;cursor:pointer}.playlist-button{color:#e7d5ff;background:#38265c}.like-button{margin-left:6px;border:0;border-radius:7px;padding:7px 9px;color:#ffb4bf;background:#3a2029;font-size:12px;cursor:pointer}.like-button.liked{color:#17131f;background:#ff5a70}.edit-button{color:#cfe7ff;background:#23384b}.delete-button{color:#ffb1b8;background:#3a2029}.empty{padding:35px;border:1px dashed #ffffff25;border-radius:12px;color:#a7adbf;text-align:center}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#000b}.modal-box{width:min(92%,900px);padding:18px;border-radius:14px;background:#1b1d24}.player{overflow:hidden;aspect-ratio:16/9;border-radius:8px;background:#000}.player iframe{width:100%;height:100%;border:0}.comments{margin-top:18px}.comments h3{margin:0 0 10px}.comment-form{display:flex;gap:8px}.comment-form input{flex:1;border:1px solid #ffffff20;border-radius:8px;padding:10px;color:#fff;background:#292b33}.comment-form button{border:0;border-radius:8px;padding:0 15px;color:#fff;background:#ff3445;font-weight:bold}.comment{margin-top:10px;padding:10px;border-radius:8px;background:#ffffff0b}.comment small{color:#989fb4}.comment p{margin:5px 0}.comment button{border:0;color:#ff9da6;background:none;cursor:pointer}.close{float:right;border:0;color:#fff;background:none;font-size:23px;cursor:pointer}.add-form{display:grid;gap:11px}.add-form input,.add-form textarea{border:1px solid #ffffff20;border-radius:8px;padding:12px;color:#fff;background:#292b33;font:inherit}.add-form textarea{min-height:110px;resize:vertical}.add-form button{border:0;border-radius:8px;padding:12px;color:#fff;background:#ff3445;font-weight:bold;cursor:pointer}.hidden{display:none}@media(max-width:700px){aside{display:none}.top{gap:8px}.logo{font-size:17px}.user{display:none}.main{width:92%}}

<header class="top"><div class="logo">▶ WatchHub</div><form id="searchForm" class="search"><input id="searchInput" placeholder="Cari di library kamu..."><button>Cari</button></form><select id="languageSelect" class="language" title="Language"><option value="id">🇮🇩 ID</option><option value="en">🇬🇧 EN</option><option value="ru">🇷🇺 RU</option><option value="uz">🇺🇿 UZ</option></select><button id="userButton" class="user">Log In</button></header>

<div id="editModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="editModal">×</button><h2>Edit video</h2><form id="editForm" class="add-form"><input id="editTitle" required placeholder="Judul video"><input id="editChannel" placeholder="Nama channel"><button>Simpan perubahan</button></form></div></div>

<div id="profileModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="profileModal">×</button><h2>Profil Channel</h2><form id="profileForm" class="add-form"><input id="profileUsername" required minlength="3" placeholder="Username channel"><textarea id="profileBio" placeholder="Ceritakan tentang channel kamu"></textarea><button>Simpan profil</button></form><p id="profileStatus" style="color:#a7adbf"></p></div></div>
<div id="channelModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="channelModal">×</button><h2 id="channelName">Channel</h2><p id="channelBio" style="color:#a7adbf"></p><p id="channelStats"></p><button id="followButton" class="add-btn">☆ Follow</button></div></div>

<script>
const SUPABASE_URL='https://jdphpvyyoedffevvmxgv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_PUBLISHABLE_KEY_HERE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const KEY='watchhub-library-local-v1';const VISITOR_KEY='watchhub-visitor-id';const visitorId=localStorage.getItem(VISITOR_KEY)||crypto.randomUUID();localStorage.setItem(VISITOR_KEY,visitorId);let videos=[],filter='all',currentUser=null,authMode='login';const $=id=>document.getElementById(id);
const translations={id:{hero:'Nonton apa hari ini?',heroText:'Tambahkan video YouTube favoritmu dan tonton dari satu library yang rapi.',home:'⌂ Beranda',saved:'♡ Tonton Nanti',history:'◷ Riwayat',searchYoutube:'↗ Cari di YouTube',yourVideos:'Video kamu',add:'＋ Tambah Video',empty:'Belum ada video. Klik “＋ Tambah Video” untuk memasukkan link YouTube.',addTitle:'Tambah video YouTube',titlePlaceholder:'Judul video',urlPlaceholder:'Paste link YouTube atau kode HTML iframe di sini',channelPlaceholder:'Nama channel',save:'Simpan ke WatchHub'},en:{hero:'What do you want to watch?',heroText:'Add your favorite YouTube videos and watch them from one organized library.',home:'⌂ Home',saved:'♡ Watch Later',history:'◷ History',searchYoutube:'↗ Search YouTube',yourVideos:'Your videos',add:'＋ Add Video',empty:'No videos yet. Click “＋ Add Video” to add a YouTube link.',addTitle:'Add YouTube video',titlePlaceholder:'Video title',urlPlaceholder:'Paste a YouTube link or HTML iframe code here',channelPlaceholder:'Channel name',save:'Save to WatchHub'},ru:{hero:'Что будем смотреть?',heroText:'Добавляйте любимые видео YouTube в одну удобную библиотеку.',home:'⌂ Главная',saved:'♡ Смотреть позже',history:'◷ История',searchYoutube:'↗ Искать на YouTube',yourVideos:'Ваши видео',add:'＋ Добавить видео',empty:'Видео пока нет. Нажмите «＋ Добавить видео», чтобы добавить ссылку YouTube.',addTitle:'Добавить видео YouTube',titlePlaceholder:'Название видео',urlPlaceholder:'Вставьте ссылку YouTube или HTML-код iframe',channelPlaceholder:'Название канала',save:'Сохранить в WatchHub'},uz:{hero:'Bugun nima tomosha qilamiz?',heroText:'Sevimli YouTube videolaringizni bitta tartibli kutubxonaga qo‘shing.',home:'⌂ Bosh sahifa',saved:'♡ Keyin ko‘rish',history:'◷ Tarix',searchYoutube:'↗ YouTube’da qidirish',yourVideos:'Videolaringiz',add:'＋ Video qo‘shish',empty:'Hozircha video yo‘q. YouTube havolasini qo‘shish uchun «＋ Video qo‘shish»ni bosing.',addTitle:'YouTube videosini qo‘shish',titlePlaceholder:'Video nomi',urlPlaceholder:'YouTube havolasi yoki HTML iframe kodini joylang',channelPlaceholder:'Kanal nomi',save:'WatchHub’ga saqlash'}};
let language=localStorage.getItem('watchhub-language')||'id';
function applyLanguage(){const t=translations[language]||translations.id;document.documentElement.lang=language;$('languageSelect').value=language;$('heroTitle').textContent=t.hero;$('heroText').textContent=t.heroText;$('homeNav').textContent=t.home;$('savedNav').textContent=t.saved;$('historyNav').textContent=t.history;$('trendingNav').textContent=t.trending||'🔥 Trending';$('shortsNav').textContent=t.shorts||'▣ Shorts';$('youtubeSearch').textContent=t.searchYoutube;$('sectionTitle').textContent=t.yourVideos;$('openAdd').textContent=t.add;$('addTitle').textContent=t.addTitle;$('videoTitle').placeholder=t.titlePlaceholder;$('videoUrl').placeholder=t.urlPlaceholder;$('videoChannel').placeholder=t.channelPlaceholder;$('saveVideoButton').textContent=t.save;}
$('languageSelect').onchange=e=>{language=e.target.value;localStorage.setItem('watchhub-language',language);applyLanguage()};$('feedButton').onclick=()=>{location.href='feed.html'};
function idFromUrl(value){const iframe=value.match(/(?:src=["']|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/i);if(iframe)return iframe[1];try{const u=new URL(value.trim());if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('?')[0];return u.searchParams.get('v')||u.pathname.split('/').pop()}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(videos))}
async function loadVideos(){const {data,error}=await db.from('watchhub_videos').select('*').order('created_at',{ascending:false});if(!error&&data){const ids=data.map(v=>v.id);const saved=ids.length?(await db.from('watchhub_saved').select('video_id').eq('visitor_id',visitorId).in('video_id',ids)).data||[]:[];const history=ids.length?(await db.from('watchhub_history').select('video_id,watched_at').eq('visitor_id',visitorId).in('video_id',ids)).data||[]:[];const likes=ids.length?(await db.from('watchhub_likes').select('video_id,user_id').in('video_id',ids)).data||[]:[];const views=ids.length?(await db.from('watchhub_views').select('video_id').in('video_id',ids)).data||[]:[];videos=data.map(v=>({id:v.youtube_id,title:v.title,channel:v.channel||'YouTube',last:(history.find(h=>h.video_id===v.id)||{}).watched_at,saved:saved.some(s=>s.video_id===v.id),likes:likes.filter(l=>l.video_id===v.id).length,views:views.filter(x=>x.video_id===v.id).length,liked:!!currentUser&&likes.some(l=>l.video_id===v.id&&l.user_id===currentUser.id),dbId:v.id,visitor_id:v.visitor_id,owner_id:v.owner_id,isShort:!!v.is_short}));render()}else{videos=JSON.parse(localStorage.getItem(KEY)||'[]');render()}}
function thumb(id){return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg'}
function render(list=videos){const cards=$('cards');cards.innerHTML='';if(!list.length){cards.innerHTML='<div class="empty">'+(translations[language]||translations.id).empty+'</div>';return}list.forEach((v,i)=>{const card=document.createElement('article');card.className='video-card';card.innerHTML='<div class="thumb"></div><div class="video-info"><h3></h3><button class="channel-link"></button><small class="view-count"></small><div class="video-actions"><button class="watch-button">♡ Watch Later</button>'+(v.isShort?'<span style="margin-left:6px;color:#ff6470;font-size:11px">SHORT</span>':'')+'<button class="playlist-button">＋ Playlist</button><button class="like-button">♡ '+(v.likes||0)+'</button>'+(currentUser&&v.owner_id===currentUser.id?'<button class="edit-button">Edit</button><button class="delete-button">Hapus</button>':'')+'</div></div>';card.querySelector('.thumb').style.backgroundImage='url('+thumb(v.id)+')';card.querySelector('.thumb').innerHTML='<span class="play">▶</span>';card.querySelector('h3').textContent=v.title;const channelLink=card.querySelector('.channel-link');channelLink.textContent=v.channel||'YouTube';card.querySelector('.view-count').textContent='▶ '+(v.views||0)+' views';channelLink.onclick=event=>{event.stopPropagation();openChannel(v)};const watchButton=card.querySelector('.watch-button');watchButton.textContent=v.saved?'♥ Tersimpan':'♡ Watch Later';watchButton.classList.toggle('saved',!!v.saved);watchButton.onclick=event=>{event.stopPropagation();toggleSaved(v)};const playlistButton=card.querySelector('.playlist-button');if(playlistButton)playlistButton.onclick=event=>{event.stopPropagation();openPlaylistPicker(v)};const likeButton=card.querySelector('.like-button');if(likeButton){likeButton.textContent=(v.liked?'♥ ':'♡ ')+(v.likes||0);likeButton.classList.toggle('liked',!!v.liked);likeButton.onclick=event=>{event.stopPropagation();toggleLike(v)}};const editButton=card.querySelector('.edit-button');if(editButton)editButton.onclick=event=>{event.stopPropagation();openEdit(v)};const deleteButton=card.querySelector('.delete-button');if(deleteButton)deleteButton.onclick=event=>{event.stopPropagation();deleteVideo(v)};card.onclick=()=>play(v);cards.appendChild(card)})}
let editingVideo=null;
function openEdit(v){if(!currentUser||v.owner_id!==currentUser.id)return;editingVideo=v;$('editTitle').value=v.title;$('editChannel').value=v.channel||'';$('editModal').classList.remove('hidden')}
async function deleteVideo(v){if(!currentUser||v.owner_id!==currentUser.id||!v.dbId)return;if(!confirm('Hapus video ini dari WatchHub?'))return;const {error}=await db.from('watchhub_videos').delete().eq('id',v.dbId);if(error){alert('Video gagal dihapus: '+error.message);return}await loadVideos();applyFilter()}
async function toggleSaved(v){if(!v.dbId)return;let result;if(v.saved){result=await db.from('watchhub_saved').delete().eq('visitor_id',visitorId).eq('video_id',v.dbId)}else{result=await db.from('watchhub_saved').insert({visitor_id:visitorId,video_id:v.dbId})}if(result.error){alert('Watch Later gagal diperbarui: '+result.error.message);return}v.saved=!v.saved;applyFilter()}
async function loadComments(videoId){const {data,error}=await db.from('watchhub_comments').select('id,user_id,comment,created_at').eq('video_id',videoId).order('created_at',{ascending:false});const list=$('commentList');if(error){list.textContent=error.message;return}list.innerHTML=data.length?'':'<p style="color:#989fb4">Belum ada komentar.</p>';data.forEach(c=>{const row=document.createElement('div');row.className='comment';row.innerHTML='<small></small><p></p>'+(currentUser&&c.user_id===currentUser.id?'<button>Hapus</button>':'');row.querySelector('small').textContent=new Date(c.created_at).toLocaleString();row.querySelector('p').textContent=c.comment;const del=row.querySelector('button');if(del)del.onclick=async()=>{await db.from('watchhub_comments').delete().eq('id',c.id).eq('user_id',currentUser.id);loadComments(videoId)};list.appendChild(row)})}
async function play(v){window.commentVideo=v;if(v.dbId){await db.from('watchhub_views').insert({video_id:v.dbId,visitor_id:visitorId});await db.from('watchhub_history').upsert.upsert({visitor_id:visitorId,video_id:v.dbId,watched_at:new Date().toISOString()},{onConflict:'visitor_id,video_id'});v.last=Date.now()}$('player').innerHTML='<iframe src="https://www.youtube.com/embed/'+v.id+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';$('playerTitle').textContent=v.title;$('playerChannel').textContent=v.channel||'YouTube';$('playerModal').classList.remove('hidden');await loadComments(v.dbId);v.last=Date.now();save()}
function applyFilter(){let q=$('searchInput').value.toLowerCase();let list=videos.filter(v=>(v.title+' '+(v.channel||'')).toLowerCase().includes(q));if(filter==='saved')list=list.filter(v=>v.saved);if(filter==='trending')list=list.sort((a,b)=>(b.views||0)-(a.views||0));if(filter==='shorts')list=list.filter(v=>v.isShort===true||v.isShort==='true'||v.isShort===1);if(filter==='recent')list=list.filter(v=>v.last).sort((a,b)=>(new Date(b.last||0))-(new Date(a.last||0)));render(list)}
$('userButton').onclick=async()=>{if(currentUser){await db.auth.signOut();currentUser=null;$('userButton').textContent='Log In';await loadVideos()}else{$('authModal').classList.remove('hidden')}};$('authSwitch').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Log In':'Sign Up';$('authSubmit').textContent=authMode==='login'?'Log In':'Sign Up';$('authSwitch').textContent=authMode==='login'?'Belum punya akun? Sign Up':'Sudah punya akun? Log In'};$('authForm').onsubmit=async e=>{e.preventDefault();$('authStatus').textContent='';const email=$('authEmail').value.trim(),password=$('authPassword').value;const result=authMode==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});if(result.error){$('authStatus').textContent=result.error.message;return}currentUser=result.data.user;$('userButton').textContent=currentUser?.email?.split('@')[0]||'Account';$('authModal').classList.add('hidden');await loadVideos()};async function toggleLike(v){if(!currentUser){$('authModal').classList.remove('hidden');return}let result;if(v.liked)result=await db.from('watchhub_likes').delete().eq('video_id',v.dbId).eq('user_id',currentUser.id);else result=await db.from('watchhub_likes').insert({video_id:v.dbId,user_id:currentUser.id});if(result.error){alert('Like gagal diperbarui: '+result.error.message);return}v.liked=!v.liked;v.likes=Math.max(0,(v.likes||0)+(v.liked?1:-1));render(videos)}
async function loadPlaylists(){if(!currentUser){$('playlistList').innerHTML='<p>Log In untuk memakai playlist.</p>';return}const {data,error}=await db.from('watchhub_playlists').select('*').order('created_at',{ascending:false});if(error){$('playlistList').textContent=error.message;return}const list=$('playlistList');list.innerHTML=data.length?'':'<p>Belum ada playlist.</p>';data.forEach(p=>{const row=document.createElement('div');row.className='shortcut';row.innerHTML='<span>▤</span><b style="flex:1"></b><button class="add-to-playlist">Pilih</button>';row.querySelector('b').textContent=p.name;row.querySelector('.add-to-playlist').onclick=async()=>{if(!window.playlistVideo)return;const {error:e}=await db.from('watchhub_playlist_videos').insert({playlist_id:p.id,video_id:window.playlistVideo.dbId});if(e&&e.code!=='23505')alert(e.message);else alert('Video masuk ke playlist '+p.name);$('playlistModal').classList.add('hidden')};list.appendChild(row)})}
async function openPlaylistPicker(v){if(!currentUser){$('authModal').classList.remove('hidden');return}window.playlistVideo=v;$('playlistModal').classList.remove('hidden');await loadPlaylists()}
let channelTarget=null,channelFollowing=false;
async function openChannel(v){if(!v.owner_id){alert('Channel ini belum memiliki profil akun.');return}channelTarget=v;const {data}=await db.from('watchhub_profiles').select('*').eq('user_id',v.owner_id).maybeSingle();if(!data){alert('Profil channel belum dibuat.');return}const followers=(await db.from('watchhub_follows').select('id',{count:'exact',head:true}).eq('following_id',v.owner_id)).count||0;channelFollowing=currentUser?!!(await db.from('watchhub_follows').select('id').eq('follower_id',currentUser.id).eq('following_id',v.owner_id).maybeSingle()).data:false;$('channelName').textContent=data.username;$('channelBio').textContent=data.bio||'Belum ada bio.';$('channelStats').textContent=followers+' follower';$('followButton').textContent=channelFollowing?'♥ Following':'☆ Follow';$('channelModal').classList.remove('hidden')}
$('followButton').onclick=async()=>{if(!currentUser){$('authModal').classList.remove('hidden');return}if(!channelTarget||channelTarget.owner_id===currentUser.id)return;const result=channelFollowing?await db.from('watchhub_follows').delete().eq('follower_id',currentUser.id).eq('following_id',channelTarget.owner_id):await db.from('watchhub_follows').insert({follower_id:currentUser.id,following_id:channelTarget.owner_id});if(result.error){alert(result.error.message);return}channelFollowing=!channelFollowing;$('followButton').textContent=channelFollowing?'♥ Following':'☆ Follow'};
$('followingNav').onclick=()=>{if(!currentUser){$('authModal').classList.remove('hidden');return}alert('Daftar Following akan ditampilkan di update berikutnya.')};
async function loadProfile(){if(!currentUser){$('authModal').classList.remove('hidden');return}const {data}=await db.from('watchhub_profiles').select('*').eq('user_id',currentUser.id).maybeSingle();$('profileUsername').value=data?.username||currentUser.email.split('@')[0];$('profileBio').value=data?.bio||'';$('profileModal').classList.remove('hidden')}
$('profileNav').onclick=loadProfile;$('profileForm').onsubmit=async e=>{e.preventDefault();if(!currentUser)return;const username=$('profileUsername').value.trim(),bio=$('profileBio').value.trim();const {error}=await db.from('watchhub_profiles').upsert({user_id:currentUser.id,username,bio},{onConflict:'user_id'});$('profileStatus').textContent=error?error.message:'Profil berhasil disimpan';};$('playlistsNav').onclick=async()=>{$('playlistModal').classList.remove('hidden');window.playlistVideo=null;await loadPlaylists()};$('playlistForm').onsubmit=async e=>{e.preventDefault();if(!currentUser){$('authModal').classList.remove('hidden');return}const {error}=await db.from('watchhub_playlists').insert({owner_id:currentUser.id,name:$('playlistName').value.trim()});if(error){alert(error.message);return}e.target.reset();await loadPlaylists()};$('commentForm').onsubmit=async e=>{e.preventDefault();if(!currentUser){$('authModal').classList.remove('hidden');return}if(!window.commentVideo?.dbId)return;const text=$('commentInput').value.trim();if(!text)return;const {error}=await db.from('watchhub_comments').insert({video_id:window.commentVideo.dbId,user_id:currentUser.id,comment:text});if(error){alert('Komentar gagal dikirim: '+error.message);return}$('commentInput').value='';await loadComments(window.commentVideo.dbId)};
$('editForm').onsubmit=async e=>{e.preventDefault();if(!editingVideo||!currentUser)return;const {error}=await db.from('watchhub_videos').update({title:$('editTitle').value.trim(),channel:$('editChannel').value.trim()||'YouTube'}).eq('id',editingVideo.dbId).eq('owner_id',currentUser.id);if(error){alert('Video gagal diedit: '+error.message);return}editingVideo=null;$('editModal').classList.add('hidden');await loadVideos();applyFilter()};
$('openAdd').onclick=()=>{if(!currentUser){$('authModal').classList.remove('hidden');return}$('addModal').classList.remove('hidden')};
$('addForm').onsubmit=async e=>{e.preventDefault();if(!currentUser){alert('Silakan Log In terlebih dahulu.');$('authModal').classList.remove('hidden');return}const id=idFromUrl($('videoUrl').value.trim());if(!id)return alert('Link YouTube atau kode HTML iframe tidak terbaca.');const title=$('videoTitle').value.trim(),channel=$('videoChannel').value.trim(),isShort=$('isShort').checked;const {error}=await db.from('watchhub_videos').insert({title,youtube_id:id,channel:channel||'YouTube',visitor_id:visitorId,is_short:isShort,owner_id:currentUser.id});if(error){alert('Video gagal disimpan: '+error.message);return}e.target.reset();$('addModal').classList.add('hidden');await loadVideos();applyFilter()};
$('homeNav').onclick=()=>{filter='all';document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));$('homeNav').classList.add('active');applyFilter()};$('searchForm').onsubmit=e=>{e.preventDefault();applyFilter()};
$('youtubeSearch').onclick=()=>{const q=prompt('Cari video di YouTube:');if(q)open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')};
document.querySelectorAll('aside button[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;applyFilter()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).classList.add('hidden');if(b.dataset.close==='playerModal')$('player').innerHTML=''});
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add('hidden')});
applyLanguage();
db.auth.getSession().then(({data})=>{currentUser=data.session?.user||null;$('userButton').textContent=currentUser?.email?.split('@')[0]||'Log In';loadVideos()});
</script>
</body>
</html>
