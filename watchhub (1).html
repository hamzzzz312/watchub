<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WatchHub</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f4f5f8;background:#0f1014;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:13px 5%;background:#17181d;border-bottom:1px solid #ffffff12}.logo{font-size:21px;font-weight:900;color:#ff4e5b;white-space:nowrap}.search{display:flex;flex:1;max-width:620px;margin:auto}.search input{width:100%;border:1px solid #ffffff20;border-radius:9px 0 0 9px;padding:11px 14px;outline:0;color:#fff;background:#26272e}.search button,.add-btn{border:0;border-radius:0 9px 9px 0;padding:0 18px;color:#fff;background:#ff3445;font-weight:bold;cursor:pointer}.user{border:0;border-radius:8px;padding:10px 13px;color:#fff;background:#292a32;cursor:pointer}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:210px;padding:22px 13px;border-right:1px solid #ffffff12;background:#15161b}aside button{display:block;width:100%;margin:4px 0;border:0;border-radius:8px;padding:12px;text-align:left;color:#cbd0e0;background:transparent;cursor:pointer}aside button:hover,aside button.active{color:#fff;background:#2a2c35}.main{width:min(1180px,92%);margin:auto;padding:30px 0}.hero{margin-bottom:26px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,45px)}.hero p{margin:0;color:#a7adbf}.section-title{display:flex;align-items:center;justify-content:space-between;margin:25px 0 15px}.section-title h2{margin:0;font-size:20px}.add-btn{border-radius:8px;padding:10px 14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}.video-card{overflow:hidden;border:1px solid #ffffff12;border-radius:12px;background:#1a1b21;cursor:pointer;transition:.2s}.video-card:hover{transform:translateY(-3px);border-color:#ff3445}.thumb{position:relative;aspect-ratio:16/9;background:#2a2b33 center/cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#ff3445dd}.video-info{padding:12px}.video-info h3{overflow:hidden;margin:0 0 7px;white-space:nowrap;text-overflow:ellipsis;font-size:15px}.video-info p{margin:0;color:#989fb4;font-size:12px}.empty{padding:35px;border:1px dashed #ffffff25;border-radius:12px;color:#a7adbf;text-align:center}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#000b}.modal-box{width:min(92%,900px);padding:18px;border-radius:14px;background:#1b1d24}.player{overflow:hidden;aspect-ratio:16/9;border-radius:8px;background:#000}.player iframe{width:100%;height:100%;border:0}.close{float:right;border:0;color:#fff;background:none;font-size:23px;cursor:pointer}.add-form{display:grid;gap:11px}.add-form input{border:1px solid #ffffff20;border-radius:8px;padding:12px;color:#fff;background:#292b33}.add-form button{border:0;border-radius:8px;padding:12px;color:#fff;background:#ff3445;font-weight:bold;cursor:pointer}.hidden{display:none}@media(max-width:700px){aside{display:none}.top{gap:8px}.logo{font-size:17px}.user{display:none}.main{width:92%}}
</style>
</head>
<body>
<header class="top"><div class="logo">▶ WatchHub</div><form id="searchForm" class="search"><input id="searchInput" placeholder="Cari di library kamu..."><button>Cari</button></form><button class="user">Guest</button></header>
<div class="layout"><aside><button class="active" data-filter="all">⌂ Home</button><button data-filter="saved">♡ Watch Later</button><button data-filter="recent">◷ History</button><button id="youtubeSearch">↗ Cari di YouTube</button></aside><main class="main"><section class="hero"><h1>Nonton apa hari ini?</h1><p>Tambahkan video YouTube favoritmu dan tonton dari satu library yang rapi.</p></section><div class="section-title"><h2 id="sectionTitle">Video kamu</h2><button id="openAdd" class="add-btn">＋ Tambah Video</button></div><div id="cards" class="cards"></div></main></div>
<div id="playerModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="playerModal">×</button><div id="player" class="player"></div><h2 id="playerTitle"></h2><p id="playerChannel" style="color:#a7adbf"></p></div></div>
<div id="addModal" class="modal hidden"><div class="modal-box"><button class="close" data-close="addModal">×</button><h2>Tambah video YouTube</h2><form id="addForm" class="add-form"><input id="videoTitle" required placeholder="Judul video"><input id="videoUrl" required placeholder="https://www.youtube.com/watch?v=..."><input id="videoChannel" placeholder="Nama channel"><button>Simpan ke WatchHub</button></form></div></div>
<script>
const KEY='watchhub-library-v1';let videos=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';const $=id=>document.getElementById(id);
function idFromUrl(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('?')[0];return u.searchParams.get('v')||u.pathname.split('/').pop()}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(videos))}function thumb(id){return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg'}
function render(list=videos){const cards=$('cards');cards.innerHTML='';if(!list.length){cards.innerHTML='<div class="empty">Belum ada video. Klik “＋ Tambah Video” untuk memasukkan link YouTube.</div>';return}list.forEach((v,i)=>{const card=document.createElement('article');card.className='video-card';card.innerHTML='<div class="thumb"></div><div class="video-info"><h3></h3><p></p></div>';card.querySelector('.thumb').style.backgroundImage='url('+thumb(v.id)+')';card.querySelector('.thumb').innerHTML='<span class="play">▶</span>';card.querySelector('h3').textContent=v.title;card.querySelector('p').textContent=v.channel||'YouTube';card.onclick=()=>play(v);cards.appendChild(card)})}
function play(v){$('player').innerHTML='<iframe src="https://www.youtube.com/embed/'+v.id+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';$('playerTitle').textContent=v.title;$('playerChannel').textContent=v.channel||'YouTube';$('playerModal').classList.remove('hidden');v.last=Date.now();save()}
function applyFilter(){let q=$('searchInput').value.toLowerCase();let list=videos.filter(v=>(v.title+' '+(v.channel||'')).toLowerCase().includes(q));if(filter==='recent')list=list.filter(v=>v.last).sort((a,b)=>(b.last||0)-(a.last||0));render(list)}
$('openAdd').onclick=()=>$('addModal').classList.remove('hidden');$('addForm').onsubmit=e=>{e.preventDefault();const id=idFromUrl($('videoUrl').value.trim());if(!id)return alert('Link YouTube tidak terbaca.');videos.unshift({id,title:$('videoTitle').value.trim(),channel:$('videoChannel').value.trim(),saved:Date.now()});save();e.target.reset();$('addModal').classList.add('hidden');applyFilter()};$('searchForm').onsubmit=e=>{e.preventDefault();applyFilter()};$('youtubeSearch').onclick=()=>{const q=prompt('Cari video di YouTube:');if(q)open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')};document.querySelectorAll('aside button[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;applyFilter()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).classList.add('hidden');if(b.dataset.close==='playerModal')$('player').innerHTML=''});document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add('hidden')});render();
</script>
</body>
</html>
